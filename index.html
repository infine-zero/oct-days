<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b20">
  <title>Oct.Days</title>
  <script>
    try {
      if (localStorage.getItem("oct-days-theme") === "day") {
        document.documentElement.dataset.theme = "day";
        document.querySelector('meta[name="theme-color"]').content = "#ffffff";
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="./style.css?v=paper-white">
  <link rel="stylesheet" href="./journey.css?v=quiet-byline">
  <link rel="stylesheet" href="./photos.css">
  <script src="./share-data.js?v=clean-titles"></script>


  <script defer src="./photos.js"></script>
  <script defer src="./journey.js?v=paper-white"></script>
  <script defer src="./app.js?v=day-night"></script>
</head>
<body>
  <header class="bar"><div class="bar-inner">
    <a id="brand" class="brand" href="#trip">Oct.Days</a>
    <nav aria-label="手账导航"><a class="submission-link" href="https://github.com/infine-zero/oct-days-inbox/issues/new?template=note.yml">投稿</a><a class="submission-link entry-edit-link" href="https://github.com/infine-zero/oct-days/edit/main/share-data.js">编辑</a>
      <button class="nav-link active" data-page="trip">旅程</button><button class="nav-link" data-page="people">人物</button><button class="nav-link" data-page="places">地点</button><button class="nav-link" data-page="album">相册</button>
    </nav>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换到日间主题" title="切换到日间主题">
      <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M11 1h2v4h-2zm0 18h2v4h-2zM1 11h4v2H1zm18 0h4v2h-4zM3.51 4.93l1.42-1.42 2.83 2.83-1.42 1.42zm12.73 12.73 1.42-1.42 2.83 2.83-1.42 1.42zM3.51 19.07l2.83-2.83 1.42 1.42-2.83 2.83zM16.24 6.34l2.83-2.83 1.42 1.42-2.83 2.83zM12 6.75a5.25 5.25 0 1 1 0 10.5 5.25 5.25 0 0 1 0-10.5Z"/>
      </svg>
      <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20.7 15.1A9.2 9.2 0 0 1 8.9 3.3a9.1 9.1 0 1 0 11.8 11.8Z"/>
      </svg>
    </button>
  </div></header>
  <main>
    <div id="notice" role="status" hidden></div>
    <section class="intro"><h1 id="headline">Oct.Days</h1><p id="subtitle">日本旅行手账</p></section>
    <section id="trip-view" aria-label="旅程">
      <div class="journey-top">
          <div class="chapter"><h2 id="chapter">10.01</h2><select id="days" aria-label="选择旅程日期" hidden></select></div>
          <div class="modes" role="group" aria-label="呈现方式"><button class="mode active" data-mode="map">地图</button><button class="mode" data-mode="explore">探索</button><button class="mode" data-mode="film">放映</button></div>
      </div>
      <div id="journey"></div>
      <section class="entries" aria-label="当日手记">
        <div id="event-list"></div>
      </section>
    </section>
    <section id="index-view" hidden><div id="index-list"></div></section>
    <button id="undated-shortcut" class="undated-shortcut" type="button" aria-label="某天" hidden>
      <svg class="kiwi-bird" viewBox="0 0 84 80" aria-hidden="true" focusable="false">
        <path d="M37 14C42 7 50 5 57 7 68 9 76 17 79 29c5 15 1 26-10 33-8 6-21 8-31 3-13-6-16-19-10-33l4-9C21 25 13 29 7 36c-2 3-6 0-4-3C9 23 21 17 37 14Z"/>
        <path class="kiwi-foot kiwi-foot-back" d="m60 61 5 1c2 5 6 7 7 11 1 2-1 3-3 2l-4-2-6 5c-2 2-4 1-3-1l2-5-4-1c-2-1-2-2 0-3l6-3Z"/>
        <path class="kiwi-foot kiwi-foot-front" d="m43 63 6 1-2 12c0 2-2 3-3 1l-2-2-9 4c-3 1-4 0-2-2l4-4-4-1c-2-1-2-3 0-3l11-3Z"/>
        <text class="kiwi-label" x="54" y="42" text-anchor="middle" dominant-baseline="central">某天</text>
      </svg>
    </button>
  </main>



</body></html>
