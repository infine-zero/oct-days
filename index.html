<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b20">
  <title>Oct.Days</title>
  <link rel="stylesheet" href="./style.css?v=inset-author">
  <link rel="stylesheet" href="./journey.css?v=quiet-byline">
  <link rel="stylesheet" href="./photos.css">
  <script src="./share-data.js?v=clean-titles"></script>


  <script defer src="./photos.js"></script>
  <script defer src="./journey.js?v=quiet-byline"></script>
  <script defer src="./app.js?v=clean-titles"></script>
</head>
<body>
  <header class="bar"><div class="bar-inner">
    <a id="brand" class="brand" href="#trip">Oct.Days</a>
    <nav aria-label="手账导航"><a class="submission-link" href="https://github.com/infine-zero/oct-days-inbox/issues/new?template=note.yml">投稿</a><a class="submission-link entry-edit-link" href="https://github.com/infine-zero/oct-days/edit/main/share-data.js">编辑</a>
      <button class="nav-link active" data-page="trip">旅程</button><button class="nav-link" data-page="people">人物</button><button class="nav-link" data-page="places">地点</button><button class="nav-link" data-page="album">相册</button>
    </nav>

  </div></header>
  <main>
    <div id="notice" role="status" hidden></div>
    <section class="intro"><h1 id="headline">Oct.Days</h1><p id="subtitle">日本旅行手账</p></section>
    <section id="trip-view" aria-label="旅程">
      <div class="journey-top">
          <div class="chapter"><h2 id="chapter">10.01</h2><select id="days" aria-label="选择旅程日期" hidden></select></div>
          <div class="modes" role="group" aria-label="呈现方式"><button class="mode active" data-mode="map">地图</button><button class="mode" data-mode="explore">探索</button><button class="mode" data-mode="film">放映</button></div>
      </div>
      <div id="journey"></div>
      <section class="entries" aria-label="当日手记">
        <div id="event-list"></div>
      </section>
    </section>
    <section id="index-view" hidden><div id="index-list"></div></section>
  </main>



</body></html>
